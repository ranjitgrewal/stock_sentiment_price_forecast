[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-ingestion"
version = "0.1.0"
description = "Ingest asset-related X posts, prices, and news into SQLite"
requires-python = ">=3.10"
dependencies = [
    "apify-client>=1.7,<3",
    "matplotlib>=3.8,<4",
    "pandas>=2.0,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]